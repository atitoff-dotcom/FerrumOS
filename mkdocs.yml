site_name: FerrumOS
site_description: "Reactive Micro-OS & Live Hot-Swap Studio for RISC-V & ESP32 Microcontrollers"
site_author: "FerrumOS Contributors"
site_url: "https://atitoff-dotcom.github.io/FerrumOS/"
repo_url: "https://github.com/atitoff-dotcom/FerrumOS"
repo_name: "atitoff-dotcom/FerrumOS"
edit_uri: "blob/master/docs/"
copyright: "Copyright &copy; 2026 FerrumOS Contributors"

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - 01. Quickstart: 1_getting_started/01_quickstart.md
      - 02. First Sensor: 1_getting_started/02_first_sensor.md
      - 03. Smart Button: 1_getting_started/03_smart_button.md
      - 04. Troubleshooting & FAQ: 1_getting_started/04_troubleshooting.md
  - Recipes:
