      - Battery Deep Sleep: 2_recipes/battery_deep_sleep.md
      - CAN Bus Networking: 2_recipes/can_networking.md
      - Electronic Shelf Labels (E-Ink): 2_recipes/esl_display.md
      - OTA Firmware Updates: 2_recipes/ota_firmware_update.md
  - API Reference:
